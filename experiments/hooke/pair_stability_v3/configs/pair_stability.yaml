# =============================================================================
# Hooke pair-stability V3 screening training base config
# =============================================================================
#
# Screening scan over input basis, update normalization/envelope, feature
# normalization/envelope, and irrep activation. The
# public override surface is scalar and slot-oriented; the planner may blind
# basis/update/feature values into Bxx/Uxx/Fxx slots, e.g.
#
#   uv run python run.py --config experiments/hooke/pair_stability_v3/configs/pair_stability.yaml \
#     run_parameters.basis_slot=B00 run_parameters.update_normalization_slot=U01 \
#     run_parameters.feature_normalization_slot=F02 run_parameters.activation_slot=SiLU \
#     run_parameters.lr=1.0e-3 run_parameters.channels=16 run_parameters.seed=0 \
#     run.root=experiments/hooke/pair_stability_v3/results/01_train \
#     run.layout=flat run.run_id=<run_id>/<attempt_id>
#
# `model.basis` and the layer's explicit feature/update/irrep controls resolve
# from structured choice libraries. The output Hooke Gaussian envelope and
# electron-electron cusp are common across all variants.
# =============================================================================

experiment:
  name: ${study.name}
  sector: pair
  run_name: ${study.name}_train

study:
  name: pair_stability_v3
  stage: "01_train"
  attempt_id: null
  config_id: null

run:
  root: experiments/hooke/pair_stability_v3/results/01_train
  # Flat layout means run.dir = run.root / run.run_id. The planner sets
  # run.run_id to "<run_id>/<attempt_id>" to realize the staged layout.
  layout: flat
  run_id: null
  dir: null
  timezone: null  # launchers inject run.timezone

runtime:
  seed: ${run_parameters.seed}
  device: cuda
  dtype: float64

terminal:
  enabled: true
  level: info
  color: auto
  rich: auto
  progress: false

# -----------------------------------------------------------------------------
# Physical system
# -----------------------------------------------------------------------------
system:
  name: hooke_pair
  n_particles: 2
  spatial_dim: 3
  omega: 0.5
  spin:
    n_up: 1
    n_down: 1

# -----------------------------------------------------------------------------
# Scalar run parameters (the public override surface)
# -----------------------------------------------------------------------------
run_parameters:
  basis_slot: raw-envelope
  update_normalization_slot: no-update-normalization
  feature_normalization_slot: no-feature-normalization
  activation_slot: SiLU
  lr: 1.0e-3
  channels: 8
  seed: 0

# -----------------------------------------------------------------------------
# Structured choice libraries
# -----------------------------------------------------------------------------
choices:
  basis:
    raw-envelope:
      basis:
        _target_: spenn.nn.RawCoordinateBasis
        spatial_dim: ${system.spatial_dim}
        include_spin: true
      tags: [main]

    hooke-s1-envelope:
      basis:
        _target_: spenn.nn.HookeOrbitalBasis
        omega: ${system.omega}
        max_shell: 1
        include_gaussian_factor: true
        spatial_dim: ${system.spatial_dim}
        include_spin: true
      tags: [main, orbital_with_envelope]

  update_normalization:
    no-update-normalization:
      update_normalization: null
      update_envelope: null
      tags: [update_none]

    update-gaussian-norm:
      update_normalization:
        _target_: spenn.nn.RealGaussianNormGate
        sigma: 1.0
      update_envelope: null
      tags: [update_scale, norm_gate]

    update-gaussian-envelope:
      update_normalization: null
      update_envelope:
        _target_: spenn.nn.RealCoordinateEnvelope
        envelope:
          _target_: spenn.nn.GaussianCoordinateEnvelope
          sigma: 1.0
      tags: [update_scale, coordinate_envelope]

  feature_normalization:
    no-feature-normalization:
      feature_normalization: null
      feature_envelope: null
      tags: [feature_none]

    feature-gaussian-norm:
      feature_normalization:
        _target_: spenn.nn.RealGaussianNormGate
        sigma: 1.0
      feature_envelope: null
      tags: [feature_scale, norm_gate]

    feature-rms-norm:
      feature_normalization:
        _target_: spenn.nn.RMSNorm
        eps: 1.0e-8
      feature_envelope: null
      tags: [feature_scale, rms]

    feature-gaussian-envelope:
      feature_normalization: null
      feature_envelope:
        _target_: spenn.nn.RealCoordinateEnvelope
        envelope:
          _target_: spenn.nn.GaussianCoordinateEnvelope
          sigma: 1.0
      tags: [feature_scale, coordinate_envelope]

  activation:
    SiLU:
      irrep_activation:
        _target_: spenn.nn.GatedNormActivation
        gate:
          _target_: torch.nn.SiLU
      tags: [irrep_activation]

    Tanh:
      irrep_activation:
        _target_: spenn.nn.GatedNormActivation
        gate:
          _target_: spenn.nn.TanhGate
      tags: [irrep_activation]

    Sigmoid:
      irrep_activation:
        _target_: spenn.nn.GatedNormActivation
        gate:
          _target_: spenn.nn.SigmoidGate
      tags: [irrep_activation]

    Exponential:
      irrep_activation:
        _target_: spenn.nn.GatedNormActivation
        gate:
          _target_: spenn.nn.GaussianDecayGate
          sigma: 1.0
      tags: [irrep_activation, gaussian]

# -----------------------------------------------------------------------------
# Model scale
# -----------------------------------------------------------------------------
model_params:
  max_order: 2
  max_virtual_order: 2
  channels: ${run_parameters.channels}
  hidden_channels: 16
  num_hidden_layers: 1
  layers: 1
  mixing_implementation: vectorized
  mixing_initial_weight: 0.5
  # Hooke-singlet-specific opposite-spin cusp range. This is a fixed study
  # parameter, not a scanned axis; callers may override it explicitly.
  cusp_opposite_range_parameter: 0.25

sampler_params:
  n_walkers: 1024
  burn_in: 500
  n_steps: 10
  proposal_scale: 0.35

training:
  max_steps: 500
  log_every_n_steps: 10
  return_terms: true

optimizer_params:
  lr: ${run_parameters.lr}

checks:
  every_n_steps: 50
  fail_fast: true
  data_integrity:
    max_nonfinite_energy_fraction: 0.0
    max_nonfinite_logabs_fraction: 0.0
    check_loss: true
    check_wavefunction_output: true
    check_batch: true
    strict_sign_values: true
  gradients:
    check_finite: true
  sampler:
    fail_fast: false
  equivariance:
    probability: 1.0
    permutation_fraction: 1.0
    max_permutations: 10
    atol: 1.0e-06
    rtol: 1.0e-06

timing:
  rolling_window: 20
  cuda_synchronize: false

load:
  path: null
  mode: none
  strict: true
  allow_protocol_mismatch: false

checkpoint:
  every_n_steps: 100
  keep_last: 3
  save_optimizer: true
  save_trainer: true
  save_sampler: true
  save_rng: true

status:
  every_n_steps: 50
  include:
    - train/loss
    - train/energy
    - train/energy_stderr
    - train/sampler/acceptance_rate
    - train/grad_norm
    - train/local_energy_finite_fraction

# =============================================================================
# Component specs
# =============================================================================
runner:
  _target_: spenn.runner.Train
  model: ${model}
  sampler: ${sampler}
  hamiltonian_terms: ${hamiltonian_terms}
  optimizer: ${optimizer}
  trainer: ${trainer}
  load: ${load}

# -----------------------------------------------------------------------------
# Model: basis -> embedding -> SpENN layers -> readout -> Gaussian envelope
# -----------------------------------------------------------------------------
model:
  _target_: spenn.nn.SpENNWaveFunction
  trace_name: spenn

  # Selected from the basis choice library or a planner-generated blinded slot.
  basis: ${choices.basis.${run_parameters.basis_slot}.basis}

  embedding:
    _target_: spenn.nn.Embedding
    max_order: ${model_params.max_order}
    spatial_dim: ${system.spatial_dim}
    out_channels: ${model_params.channels}
    hidden_channels: ${model_params.hidden_channels}
    num_hidden_layers: ${model_params.num_hidden_layers}
    # The basis already supplies the per-particle spin channel.
    include_spins: false
    # Input width is whatever the selected basis emits.
    in_features: ${spenn.basis_feature_dim:${model.basis}}
    embedding_normalization: null
    embedding_envelope: null

  layers:
    - _target_: spenn.nn.SpENNLayer
      mixing:
        _target_: spenn.nn.EquivariantMixing
        max_order: ${model_params.max_order}
        max_virtual_order: ${model_params.max_virtual_order}
        channels: ${model_params.channels}
        implementation: ${model_params.mixing_implementation}
        initial_weight: ${model_params.mixing_initial_weight}
      fourier:
        _target_: spenn.reps.FourierTransform
      feature_normalization: ${choices.feature_normalization.${run_parameters.feature_normalization_slot}.feature_normalization}
      feature_envelope: ${choices.feature_normalization.${run_parameters.feature_normalization_slot}.feature_envelope}
      irrep_activation: ${choices.activation.${run_parameters.activation_slot}.irrep_activation}
      path_aggregation:
        _target_: spenn.nn.PathAggregation
        max_order: ${model_params.max_order}
        max_virtual_order: ${model_params.max_virtual_order}
        channels: ${model_params.channels}
      inverse_fourier:
        _target_: spenn.reps.InverseFourierTransform
      update:
        _target_: spenn.nn.ResidualUpdate
      update_normalization: ${choices.update_normalization.${run_parameters.update_normalization_slot}.update_normalization}
      update_envelope: ${choices.update_normalization.${run_parameters.update_normalization_slot}.update_envelope}

  # Common Gaussian output prior plus the constant analytic electron-electron
  # cusp, held fixed across the scan.
  envelope:
    _target_: spenn.nn.AdditiveEnvelope
    envelopes:
      - _target_: spenn.nn.HookeGaussianEnvelope
        omega: ${system.omega}
      - _target_: spenn.nn.ElectronElectronCusp
        opposite_range_parameter: ${model_params.cusp_opposite_range_parameter}

  readout:
    _target_: spenn.nn.readout.PfaffianReadout
    channels: ${model_params.channels}

hamiltonian_terms:
  kinetic:
    _target_: spenn.physics.kinetic.KineticEnergy
  harmonic_trap:
    _target_: spenn.physics.potential.HarmonicTrap
    omega: ${system.omega}
  electron_electron:
    _target_: spenn.physics.potential.ElectronElectronInteraction

sampler:
  _target_: spenn.sampling.metropolis.MetropolisSampler
  n_walkers: ${sampler_params.n_walkers}
  burn_in: ${sampler_params.burn_in}
  n_steps: ${sampler_params.n_steps}
  proposal_scale: ${sampler_params.proposal_scale}
  seed: ${runtime.seed}
  n_electrons: ${system.n_particles}
  spatial_dim: ${system.spatial_dim}
  n_up: ${system.spin.n_up}
  n_down: ${system.spin.n_down}
  dtype: ${runtime.dtype}

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: ${optimizer_params.lr}

trainer:
  _target_: spenn.training.trainer.VMCTrainer
  max_steps: ${training.max_steps}
  log_every_n_steps: ${training.log_every_n_steps}
  return_terms: ${training.return_terms}

callbacks:
  - _target_: spenn.callback.ConfigSnapshot
    triggers: [run_start]
    output_path: ${run.dir}/config.yaml
  - _target_: spenn.callback.ResolvedConfigSnapshot
    triggers: [run_start]
    output_path: ${run.dir}/resolved_config.yaml
  - _target_: spenn.callback.Metadata
    triggers: [run_start, run_end, exception]
    output_path: ${run.dir}/metadata.json
  - _target_: spenn.callback.Status
    triggers: [run_start, run_end, exception]
    output_path: ${run.dir}/status.json
  - _target_: spenn.callback.DataIntegrity
    triggers: [step_end]
    every_n_steps: ${checks.every_n_steps}
    fail_fast: ${checks.fail_fast}
    max_nonfinite_energy_fraction: ${checks.data_integrity.max_nonfinite_energy_fraction}
    max_nonfinite_logabs_fraction: ${checks.data_integrity.max_nonfinite_logabs_fraction}
    check_loss: ${checks.data_integrity.check_loss}
    check_wavefunction_output: ${checks.data_integrity.check_wavefunction_output}
    check_batch: ${checks.data_integrity.check_batch}
    strict_sign_values: ${checks.data_integrity.strict_sign_values}
  - _target_: spenn.callback.GradientStats
    triggers: [step_end]
    every_n_steps: ${checks.every_n_steps}
    fail_fast: ${checks.fail_fast}
    check_finite: ${checks.gradients.check_finite}
  - _target_: spenn.callback.SamplerHealth
    triggers: [step_end]
    every_n_steps: ${checks.every_n_steps}
    fail_fast: ${checks.sampler.fail_fast}
  - _target_: spenn.callback.RuntimeEquivariance
    triggers: [step_end]
    every_n_steps: ${checks.every_n_steps}
    probability: ${checks.equivariance.probability}
    fail_fast: ${checks.fail_fast}
    artifact_dir: ${run.dir}/checks/equivariance
    checkers:
      - _target_: spenn.equivariance.checks.FullModelEquivarianceChecker
        permutation_fraction: ${checks.equivariance.permutation_fraction}
        max_permutations: ${checks.equivariance.max_permutations}
        seed: ${runtime.seed}
        atol: ${checks.equivariance.atol}
        rtol: ${checks.equivariance.rtol}
      - _target_: spenn.equivariance.checks.TraceEquivarianceChecker
        permutation_fraction: ${checks.equivariance.permutation_fraction}
        max_permutations: ${checks.equivariance.max_permutations}
        seed: ${runtime.seed}
        compare_output: false
        atol: ${checks.equivariance.atol}
        rtol: ${checks.equivariance.rtol}
  - _target_: spenn.callback.Checkpoint
    triggers: [step_end]
    every_n_steps: ${checkpoint.every_n_steps}
    output_dir: ${run.dir}/checkpoints
    keep_last: ${checkpoint.keep_last}
    save_optimizer: ${checkpoint.save_optimizer}
    save_trainer: ${checkpoint.save_trainer}
    save_sampler: ${checkpoint.save_sampler}
    save_rng: ${checkpoint.save_rng}
  - _target_: spenn.callback.Checkpoint
    triggers: [train_end]
    output_dir: ${run.dir}/checkpoints
    save_optimizer: ${checkpoint.save_optimizer}
    save_trainer: ${checkpoint.save_trainer}
    save_sampler: ${checkpoint.save_sampler}
    save_rng: ${checkpoint.save_rng}
  - _target_: spenn.callback.RunTiming
    triggers: [run_start, run_end, exception]
    cuda_synchronize: ${timing.cuda_synchronize}
  - _target_: spenn.callback.TrainStepTiming
    triggers: [step_start, step_end]
    rolling_window: ${timing.rolling_window}
    cuda_synchronize: ${timing.cuda_synchronize}
  - _target_: spenn.callback.TrainPhaseTiming
    triggers: [train_phase_start, train_phase_end]
    cuda_synchronize: ${timing.cuda_synchronize}
  - _target_: spenn.callback.ResourceUsage
    triggers: [run_start, run_end, exception, run_failed]
  - _target_: spenn.callback.Status
    triggers: [step_end]
    every_n_steps: ${status.every_n_steps}
    include: ${status.include}

loggers:
  - _target_: spenn.logging.CSV
    path: ${run.dir}/metrics.csv
  - _target_: spenn.logging.JSONL
    path: ${run.dir}/metrics.jsonl
