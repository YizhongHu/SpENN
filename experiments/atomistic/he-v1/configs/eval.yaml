# Evaluate a restored helium checkpoint. The model block must stay identical
# to train.yaml because model-only restore is strict.

experiment:
  name: tpen_he_v1
  sector: atomistic
  run_name: tpen_he_v1_eval

run:
  root: experiments/atomistic/he-v1/outputs
  run_id: null
  dir: null
  timezone: America/New_York

runtime:
  seed: 0
  device: cuda
  dtype: float64

system:
  id: he_atom
  n_particles: 2
  spatial_dim: 3
  spin:
    n_up: 1
    n_down: 1
  nuclei:
    positions: [[0.0, 0.0, 0.0]]
    charges: [2.0]
  reference_energy: -2.903724377034119598

evaluation:
  namespace: eval
  seed: ${runtime.seed}
  artifact_level: summaries
  task_failure_policy: continue
  return_terms: true

load:
  path: ???
  mode: model_only
  strict: true
  allow_protocol_mismatch: false

runner:
  _target_: tpen.runner.Evaluate
  model: ${model}
  load: ${load}
  evaluator: ${evaluator}

evaluator:
  _target_: tpen.evaluation.Evaluator
  namespace: ${evaluation.namespace}
  seed: ${evaluation.seed}
  artifact_level: ${evaluation.artifact_level}
  task_failure_policy: ${evaluation.task_failure_policy}
  tasks:
    - ${evaluation_tasks.mcmc_energy}
    - ${evaluation_tasks.he_radial_profiles}
    - ${evaluation_tasks.full_model_antisymmetry}
    - ${evaluation_tasks.spatial_exchange_symmetry}
    - ${evaluation_tasks.trace_equivariance}

model:
  _target_: tpen.nn.TPENWaveFunction
  trace_name: tpen
  embedding:
    _target_: tpen.nn.Embedding
    max_order: 2
    spatial_dim: ${system.spatial_dim}
    out_channels: 4
    hidden_channels: 16
    num_hidden_layers: 1
    include_spins: true
  layers:
    - _target_: tpen.nn.TPENLayer
      mixing:
        _target_: tpen.nn.EquivariantMixing
        max_order: 2
        max_virtual_order: 2
        channels: 4
        implementation: vectorized
        initial_weight: 0.5
        activation:
          _target_: torch.nn.SiLU
      path_aggregation:
        _target_: tpen.nn.PathAggregation
        max_order: 2
        max_virtual_order: 2
        channels: 4
        activation:
          _target_: torch.nn.SiLU
      update:
        _target_: tpen.nn.ResidualUpdater
  nuclear_envelope:
    _target_: tpen.nn.NuclearFactorizedEnvelope
    regular_envelope:
      _target_: tpen.nn.AdditiveEnvelope
      envelopes:
        - _target_: tpen.nn.ElectronElectronCusp
    nuclear_confinement:
      _target_: tpen.nn.NuclearConfinement
  readout:
    _target_: tpen.nn.readout.PfaffianReadout
    channels: 4

hamiltonian_terms:
  kinetic:
    _target_: tpen.physics.kinetic.KineticEnergy
  electron_nucleus:
    _target_: tpen.physics.potential.ElectronNucleusInteraction
    # Match train: evaluation must not reintroduce a hidden distance floor.
    eps: 0.0
  electron_electron:
    _target_: tpen.physics.potential.ElectronElectronInteraction

evaluation_sampler:
  _target_: tpen.sampling.metropolis.MetropolisSampler
  n_walkers: 1024
  burn_in: 100
  n_steps: 10
  proposal_scale: 0.5
  seed: ${evaluation.seed}
  n_electrons: ${system.n_particles}
  spatial_dim: ${system.spatial_dim}
  n_up: ${system.spin.n_up}
  n_down: ${system.spin.n_down}
  nuclear_positions:
    _target_: torch.tensor
    data: ${system.nuclei.positions}
  nuclear_charges:
    _target_: torch.tensor
    data: ${system.nuclei.charges}
  dtype: ${runtime.dtype}

evaluation_tasks:
  mcmc_energy:
    name: mcmc_energy
    namespace: ${evaluation.namespace}/mcmc_energy
    output_dir: ${run.dir}/mcmc_energy
    generator:
      _target_: tpen.evaluation.generators.MCMCGenerator
      sampler: ${evaluation_sampler}
      seed: ${evaluation.seed}
      max_samples: 1024
    calculators:
      - _target_: tpen.evaluation.calculators.LocalEnergyCalculator
        hamiltonian_terms: ${hamiltonian_terms}
        return_terms: ${evaluation.return_terms}
        chunk_size: 256
    summaries:
      - _target_: tpen.evaluation.summaries.LocalEnergySummary
      - _target_: tpen.evaluation.summaries.ReferenceEnergySummary
        reference_energy: ${system.reference_energy}
  he_radial_profiles:
    name: he_radial_profiles
    namespace: ${evaluation.namespace}/he_radial_profiles
    output_dir: ${run.dir}/he_radial_profiles
    generator:
      _target_: tpen.evaluation.generators.HeliumRadialGridGenerator
      cusp_radii: [0.0001, 0.0002, 0.0005, 0.001]
      tail_radii: [4.0, 6.0, 8.0]
      spectator_radius: 1.0
      n_directions: 3
      nuclear_positions:
        _target_: torch.tensor
        data: ${system.nuclei.positions}
      nuclear_charges:
        _target_: torch.tensor
        data: ${system.nuclei.charges}
    calculators:
      - _target_: tpen.evaluation.calculators.ElectronNucleusRadialCalculator
        chunk_size: 32
    summaries:
      - _target_: tpen.evaluation.summaries.ElectronNucleusCuspSummary
        max_fit_points: 4
      - _target_: tpen.evaluation.summaries.ElectronNucleusTailSummary
      - _target_: tpen.evaluation.summaries.ElectronNucleusRadialProfileWriter
  full_model_antisymmetry:
    name: full_model_antisymmetry
    namespace: ${evaluation.namespace}/full_model_antisymmetry
    output_dir: ${run.dir}/full_model_antisymmetry
    generator:
      _target_: tpen.evaluation.generators.PermutationOrbitGenerator
      n_permutations: 1
      seed: ${evaluation.seed}
      base_generator:
        _target_: tpen.evaluation.generators.MCMCGenerator
        sampler: ${evaluation_sampler}
        seed: ${evaluation.seed}
        max_samples: 8
    calculators:
      - _target_: tpen.evaluation.calculators.FullModelAntisymmetryCalculator
    summaries:
      - _target_: tpen.evaluation.summaries.TransformConsistencySummary
  spatial_exchange_symmetry:
    name: spatial_exchange_symmetry
    namespace: ${evaluation.namespace}/spatial_exchange_symmetry
    output_dir: ${run.dir}/spatial_exchange_symmetry
    generator:
      _target_: tpen.evaluation.generators.ExchangeOrbitGenerator
      exchange: opposite_spin_pair
      base_generator:
        _target_: tpen.evaluation.generators.MCMCGenerator
        sampler: ${evaluation_sampler}
        seed: ${evaluation.seed}
        max_samples: 8
    calculators:
      - _target_: tpen.evaluation.calculators.SpatialExchangeSymmetryCalculator
    summaries:
      - _target_: tpen.evaluation.summaries.TransformConsistencySummary
  trace_equivariance:
    name: trace_equivariance
    namespace: ${evaluation.namespace}/trace_equivariance
    output_dir: ${run.dir}/trace_equivariance
    generator:
      _target_: tpen.evaluation.generators.PermutationOrbitGenerator
      n_permutations: 1
      seed: ${evaluation.seed}
      base_generator:
        _target_: tpen.evaluation.generators.MCMCGenerator
        sampler: ${evaluation_sampler}
        seed: ${evaluation.seed}
        max_samples: 4
    calculators:
      - _target_: tpen.evaluation.calculators.TraceEquivarianceCalculator
    summaries:
      - _target_: tpen.evaluation.summaries.TraceEquivarianceSummary

callbacks:
  - _target_: tpen.callback.ConfigSnapshot
    output_path: ${run.dir}/config.yaml
  - _target_: tpen.callback.ResolvedConfigSnapshot
    output_path: ${run.dir}/resolved_config.yaml
  - _target_: tpen.callback.Metadata
    output_path: ${run.dir}/metadata.json
  - _target_: tpen.callback.Status
    output_path: ${run.dir}/status.json

loggers:
  - _target_: tpen.logging.CSV
    path: ${run.dir}/metrics.csv
  - _target_: tpen.logging.JSONL
    path: ${run.dir}/metrics.jsonl
