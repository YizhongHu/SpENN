# Opt-in overlay for the eligible helium electron-nucleus analytic path.
# Merge this mapping into eval.yaml for an isolated analytic evaluation; the
# task replacement below makes the overlay executable. Omission leaves the
# NaiveLocalEnergyEvaluator path unchanged.

local_energy_evaluator:
  _target_: tpen.physics.hamiltonian.AnalyticCuspEvaluator

# The analytic grouping fuses kinetic with the electron-nucleus Coulomb term
# only. Helium also carries tpen.nn.ElectronElectronCusp: that factor remains
# inside the regular part f and is handled by autodiff, while
# electron_electron remains an ordinary unclaimed Hamiltonian term. Nothing is
# dropped or double-counted, but helium's electron-electron coalescence is NOT
# regularized; with two electrons that singularity matters more than in H2 at
# typical geometries. Electron-electron cusp fusion is deferred by design.

# Bind the already-instantiated electron-nucleus factor by its position in
# `model.factors`; TPENWaveFunction resolves this edge internally so Hydra
# cannot create a non-identical provider object.
model:
  analytic_cusp_provider_index: 1

analytic_local_energy_calculator:
  _target_: tpen.evaluation.calculators.LocalEnergyCalculator
  hamiltonian_terms: ${hamiltonian_terms}
  return_terms: true
  evaluator: ${local_energy_evaluator}

analytic_trajectory_generator:
  _target_: tpen.evaluation.generators.TrajectoryMCMCGenerator
  sampler: ${evaluation_sampler}
  hamiltonian_terms: ${hamiltonian_terms}
  n_draws: 4
  evaluator: ${local_energy_evaluator}

# Replace the actual task nodes. These references are deliberately task-level:
# run_from_config instantiates the runner subtree, so detached named components
# alone cannot affect a run.
evaluation_tasks:
  mcmc_energy:
    # Required by the repository-wide task hygiene contract. Keep this equal
    # to the base task's run-rooted path; the composition test pins that sync.
    output_dir: ${run.dir}/mcmc_energy
    generator: ${analytic_trajectory_generator}
    calculators:
      - ${analytic_local_energy_calculator}
      # Preserve the base task's producer for SampledRecordWriter.
      - _target_: tpen.evaluation.calculators.WavefunctionCalculator
