# Minimal all-electron helium smoke configuration.
#
# This is deliberately a development configuration.  Production atom runs are
# submitted only after its PR stack has reached `main`.

experiment:
  name: tpen_he_v1
  sector: atomistic
  run_name: tpen_he_v1_train

run:
  root: experiments/atomistic/he-v1/outputs
  run_id: null
  dir: null
  timezone: America/New_York

runtime:
  seed: 0
  device: cuda
  dtype: float64

system:
  id: he_atom
  n_particles: 2
  spatial_dim: 3
  spin:
    n_up: 1
    n_down: 1
  nuclei:
    positions: [[0.0, 0.0, 0.0]]
    charges: [2.0]
  # Infinite-nuclear-mass, nonrelativistic 1 1S reference from the canonical
  # baseline registry. Keep this literal coupled to the registry test.
  reference_energy: -2.903724377034119598

# Sole typed nuclear-geometry authority (A5): one `AtomicConfiguration`
# instance shared by the wavefunction's post-readout ElectronNucleusCusp
# factor AND the generic Hamiltonian Coulomb terms below (`electron_nucleus`,
# `nucleus_nucleus`). The sampler still separately constructs its own
# equal-valued `AtomicConfiguration` from `nuclear_positions`/
# `nuclear_charges` for batch transport (A2); construction-time `atoms` and
# transported batch context are reconciled by value (not object identity) at
# every Hamiltonian term via `_validate_batch_atoms_context`.
atoms:
  _target_: tpen.data.atomic_configuration.AtomicConfiguration
  positions:
    _target_: torch.tensor
    data: ${system.nuclei.positions}
  charges:
    _target_: torch.tensor
    data: ${system.nuclei.charges}

runner:
  _target_: tpen.runner.Train
  model: ${model}
  sampler: ${sampler}
  hamiltonian_terms: ${hamiltonian_terms}
  optimizer: ${optimizer}
  trainer: ${trainer}

model:
  _target_: tpen.nn.TPENWaveFunction
  trace_name: tpen
  embedding:
    _target_: tpen.nn.Embedding
    max_order: 2
    spatial_dim: ${system.spatial_dim}
    out_channels: 4
    hidden_channels: 16
    num_hidden_layers: 1
    include_spins: true
  layers:
    - _target_: tpen.nn.TPENLayer
      mixing:
        _target_: tpen.nn.EquivariantMixing
        max_order: 2
        max_virtual_order: 2
        channels: 4
        implementation: vectorized
        initial_weight: 0.5
        activation:
          _target_: torch.nn.SiLU
      path_aggregation:
        _target_: tpen.nn.PathAggregation
        max_order: 2
        max_virtual_order: 2
        channels: 4
        activation:
          _target_: torch.nn.SiLU
      update:
        _target_: tpen.nn.ResidualUpdater
  # One composable generic post-readout factor pipeline (A5): electron-electron
  # cusp and the electron-nucleus cusp (linear He-compatibility law) sum
  # directly, replacing the retired envelope/nuclear_envelope split.
  factors:
    - _target_: tpen.nn.ElectronElectronCusp
    - _target_: tpen.nn.ElectronNucleusCusp
      atoms: ${atoms}
  readout:
    _target_: tpen.nn.readout.PfaffianReadout
    channels: 4

hamiltonian_terms:
  kinetic:
    _target_: tpen.physics.kinetic.KineticEnergy
  # Generic, constructor-owned AtomicConfiguration Coulomb terms (A3), sharing
  # the exact same `atoms` instance as the wavefunction's ElectronNucleusCusp
  # above -- one typed nuclear-geometry authority for the whole He run.
  electron_nucleus:
    _target_: tpen.physics.potential.ElectronNucleusPotential
    atoms: ${atoms}
    # The He raw-oracle contract measures the true Coulomb cancellation.
    # A floor would mask the near-nucleus numerical behavior under test.
    eps: 0.0
  electron_electron:
    _target_: tpen.physics.potential.ElectronElectronInteraction
  nucleus_nucleus:
    _target_: tpen.physics.potential.NucleusNucleusPotential
    atoms: ${atoms}

sampler:
  _target_: tpen.sampling.metropolis.MetropolisSampler
  n_walkers: 128
  burn_in: 100
  n_steps: 10
  proposal_scale: 0.5
  seed: ${runtime.seed}
  n_electrons: ${system.n_particles}
  spatial_dim: ${system.spatial_dim}
  n_up: ${system.spin.n_up}
  n_down: ${system.spin.n_down}
  # MetropolisSampler's public constructor is tensor-typed.  Make the
  # config boundary explicit rather than relying on an implementation detail
  # of its internal nuclear-context normalizer.
  nuclear_positions:
    _target_: torch.tensor
    data: ${system.nuclei.positions}
  nuclear_charges:
    _target_: torch.tensor
    data: ${system.nuclei.charges}
  dtype: ${runtime.dtype}

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.005

trainer:
  _target_: tpen.training.trainer.VMCTrainer
  max_steps: 25
  log_every_n_steps: 1
  return_terms: true

callbacks:
  - _target_: tpen.callback.ConfigSnapshot
    output_path: ${run.dir}/config.yaml
  - _target_: tpen.callback.ResolvedConfigSnapshot
    output_path: ${run.dir}/resolved_config.yaml
  - _target_: tpen.callback.Metadata
    output_path: ${run.dir}/metadata.json
  - _target_: tpen.callback.Status
    output_path: ${run.dir}/status.json
  - _target_: tpen.callback.DataIntegrity
    every_n_steps: 1
    fail_fast: true
    max_nonfinite_energy_fraction: 0.0
    max_nonfinite_logabs_fraction: 0.0
    check_loss: true
    check_wavefunction_output: true
    check_batch: true
    strict_sign_values: true
  - _target_: tpen.callback.GradientStats
    every_n_steps: 5
    fail_fast: true
    check_finite: true
  - _target_: tpen.callback.SamplerHealth
    every_n_steps: 5
    fail_fast: false
  - _target_: tpen.callback.RuntimeEquivariance
    every_n_steps: 5
    probability: 1.0
    fail_fast: true
    artifact_dir: ${run.dir}/checks/equivariance
    checkers:
      - _target_: tpen.equivariance.checks.FullModelEquivarianceChecker
        permutation_fraction: 1.0
        max_permutations: 1
        seed: ${runtime.seed}
        atol: 1.0e-06
        rtol: 1.0e-06
      - _target_: tpen.equivariance.checks.TraceEquivarianceChecker
        permutation_fraction: 1.0
        max_permutations: 1
        seed: ${runtime.seed}
        compare_output: false
        atol: 1.0e-06
        rtol: 1.0e-06
  - _target_: tpen.callback.Checkpoint
    terminal: false
    every_n_steps: 5
    output_dir: ${run.dir}/checkpoints

loggers:
  - _target_: tpen.logging.CSV
    path: ${run.dir}/metrics.csv
  - _target_: tpen.logging.JSONL
    path: ${run.dir}/metrics.jsonl
