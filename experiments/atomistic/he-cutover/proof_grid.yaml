    mem_gb: 32
    gpus: 1
  polaris_scaling:
    runtime: tpen-polaris
    partition: debug-scaling
    stratum: a100_40gb
    timeout_min: 50
    cpus: 4
    mem_gb: 32
    gpus: 1
