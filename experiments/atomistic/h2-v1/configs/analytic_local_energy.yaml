# Opt-in overlay for an eligible generic electron-nucleus evaluation.
# Merge this mapping into an existing evaluation config; omission keeps the
# NaiveLocalEnergyEvaluator default unchanged.

local_energy_evaluator:
  _target_: tpen.physics.hamiltonian.AnalyticCuspEvaluator

# This is the explicit calculator construction used in the eligible H2
# example. The model binds the participating factor by index; the constructor
# resolves that index against already-instantiated factors, preserving identity.
model:
  analytic_cusp_provider_index: 1

analytic_local_energy_calculator:
  _target_: tpen.evaluation.calculators.LocalEnergyCalculator
  hamiltonian_terms: ${hamiltonian_terms}
  return_terms: true
  evaluator: ${local_energy_evaluator}

# The overlay is executable: replace the actual task nodes so the runner uses
# these components rather than merely defining detached named components.
analytic_trajectory_generator:
  _target_: tpen.evaluation.generators.TrajectoryMCMCGenerator
  sampler: ${evaluation_sampler}
  hamiltonian_terms: ${hamiltonian_terms}
  n_draws: 4
  evaluator: ${local_energy_evaluator}

evaluation_tasks:
  mcmc_energy:
    # Required by the repository-wide task hygiene contract. Keep this equal
    # to the base task's run-rooted path; the composition test pins that sync.
    output_dir: ${run.dir}/mcmc_energy
    generator: ${analytic_trajectory_generator}
    calculators:
      - ${analytic_local_energy_calculator}
